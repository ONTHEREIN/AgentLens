<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="AgentLens 审计台：记录并可视化智能体的思考—行动链路，辅助缺陷定位与人工复核。">
  <title>AgentLens · 智能体审计台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c6145'/%3E%3Ccircle cx='14' cy='14' r='6.5' stroke='%23dcec9b' stroke-width='2' fill='none'/%3E%3Cpath d='m19 19 6 6' stroke='%23dcec9b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./audit.css">
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>
  <div class="run-progress" id="runProgress" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/runs" aria-label="AgentLens 审计台首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="14" cy="14" r="8.5" stroke="currentColor" stroke-width="2"/>
          <path d="M20.5 20.5 27 27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 14h8M14 10v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
        </svg>
      </span>
      <span class="brand-copy">
        <strong>AgentLens</strong>
        <small>智能体审计台</small>
      </span>
    </a>

    <nav class="topnav" aria-label="页面导航">
      <a href="#/runs" data-nav="runs">运行记录</a>
      <a href="#/reviews" data-nav="reviews">人工复核</a>
    </nav>

    <div class="top-actions">
      <label class="reviewer-field">
        <span>复核人</span>
        <input id="reviewerInput" type="text" maxlength="40" placeholder="填写姓名" autocomplete="name">
      </label>
      <span class="offline-pill"><i></i> 本地回放</span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="detail-placeholder">
      <span class="loading-orbit" aria-hidden="true"></span>
      <p>正在连接本地审计服务…</p>
    </div>
  </main>

  <footer class="footer">
    <span>AgentLens · 测链路，不是测答案</span>
    <span>数据来自 results/ 与 reviews/ · 页面发起的运行一律回放，不调用被测模型</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
