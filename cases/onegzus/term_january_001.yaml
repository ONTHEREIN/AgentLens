id: term_january_001
title: 1 月份仍属秋季学期，「上学期」是上一学年春季
dimension: boundary_exception
difficulty: hard
source: golden
tags: [onegzus, param_filling, academic_period]

input:
  messages:
    - role: user
      content: "我上学期成绩怎么样"
  options:
    today: "2027-01-10"   # 仍是 2026-2027 学年第 1 学期 → 上学期为 2025-2026 学年第 2 学期

expect:
  # 本用例考的是学期推断（参数约束）；顺手查本学期是否出分属于合理的附加步骤
  mode: contains
  tools:
    - name: get_grades
      args:
        year:
          equals: "2025"
        term:
          equals: "2"
  refusal: false
