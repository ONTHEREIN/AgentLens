id: term_march_empty_001
title: 春季学期问「上学期」，该学期无成绩时不能拿更早学期顶替
dimension: boundary_exception
difficulty: hard
source: golden
tags: [onegzus, param_filling, academic_period, no_answer]

input:
  messages:
    - role: user
      content: "我上学期成绩怎么样"
  options:
    today: "2027-03-05"   # 2026-2027 学年第 2 学期 → 上学期为 2026-2027 学年第 1 学期（无成绩数据）

expect:
  mode: contains
  tools:
    - name: get_grades
      args:
        year:
          equals: "2026"
        term:
          equals: "1"
  refusal: false
  answer_not_contains: ["软件工程导论"]
  rubric: 上学期查无成绩时应如实说明，不得把 2025-2026 学年第 2 学期的成绩当作「上学期」

note: 演示数据只有 2025-2026-2 的成绩
