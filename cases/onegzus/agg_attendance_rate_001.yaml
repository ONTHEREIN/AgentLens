id: agg_attendance_rate_001
title: 聚合计算：上学期整体出勤率
dimension: functional_accuracy
difficulty: medium
source: golden
tags: [onegzus, aggregation, D-001]

input:
  messages:
    - role: user
      content: "我上学期的整体出勤率是多少"
  options:
    today: "2026-09-21"

expect:
  mode: contains
  tools:
    - name: get_attendance
      args:
        year:
          equals: "2025"
        term:
          equals: "2"
  refusal: false
  rubric: 两门课合计正常出勤 30 次、请假 1 次、总计 31 次；出勤率口径需说明（含请假为 30/31≈96.8%，不计请假为 100%），给出的数值须与所述口径一致

note: 口径有歧义，不写关键词断言，交给 LLM 裁判按 rubric 判（D-001 变体）
