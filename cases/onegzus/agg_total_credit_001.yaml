id: agg_total_credit_001
title: 聚合计算：上学期总学分
dimension: functional_accuracy
difficulty: medium
source: golden
tags: [onegzus, aggregation, D-001]

input:
  messages:
    - role: user
      content: "我上学期一共拿了多少学分"
  options:
    today: "2026-09-21"

expect:
  mode: contains
  tools:
    - name: get_grades
      args:
        year:
          equals: "2025"
        term:
          equals: "2"
  refusal: false
  answer_contains: ["14"]

note: 2+4+2+3+3 = 14（D-001 变体，最简单的求和）
