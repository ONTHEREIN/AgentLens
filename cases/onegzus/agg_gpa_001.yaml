id: agg_gpa_001
title: 聚合计算：上学期加权平均绩点
dimension: functional_accuracy
difficulty: medium
source: golden
tags: [onegzus, aggregation, D-001]

input:
  messages:
    - role: user
      content: "我上学期加权平均绩点是多少"
  options:
    today: "2026-09-21"

expect:
  mode: contains
  tools:
    - name: get_grades
      args:
        year:
          equals: "2025"
        term:
          equals: "2"
  refusal: false
  answer_contains: ["3.72"]

note: Σ(绩点×学分)/Σ学分 = 52.1/14 = 3.721（D-001 变体）
