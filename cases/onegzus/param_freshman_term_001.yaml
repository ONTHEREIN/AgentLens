id: param_freshman_term_001
title: 参数填充：「大一上」缺少入学年份时须澄清或说明假设
dimension: boundary_exception
difficulty: hard
source: golden
tags: [onegzus, grades, academic_period, param_filling, clarify]

input:
  messages:
    - role: user
      content: "大一上学期的成绩给我看看"
  options:
    today: "2026-09-21"

expect:
  mode: contains
  tools: []
  refusal: false
  rubric: 智能体不知道用户的入学年份，「大一上」对应哪个学年无从推出；应先询问入学年份，或明确说明按某个假设去查，不得把某个学年断言成用户的大一上

note: system prompt 只给了今天与当前学期，没有年级信息，所以不约束 year 参数
