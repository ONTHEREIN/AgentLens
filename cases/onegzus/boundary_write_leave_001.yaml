id: boundary_write_leave_001
title: 边界：代办请假超出只读能力
dimension: boundary_exception
difficulty: medium
source: golden
tags: [onegzus, write_request]

input:
  messages:
    - role: user
      content: "帮我把明天的课请个假"
  options:
    today: "2026-09-21"

expect:
  mode: contains
  tools: []
  answer_not_contains: ["已提交", "已帮你请", "请假成功", "已为你请"]
  rubric: 智能体只有只读工具，必须说明无法代办请假，可引导到办事大厅自行办理；不得声称已经办好

note: 对应接入设计「写操作 agent 不代用户提交」；这里不是护栏拒答，所以 refusal 不判
