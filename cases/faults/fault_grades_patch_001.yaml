id: fault_grades_patch_001
title: 一门成绩被静默篡改：答案忠实于观测，根因在数据源
dimension: functional_accuracy
difficulty: hard
source: golden
tags: [onegzus, fault, "fault:patch", calibration]

input:
  messages:
    - role: user
      content: "我上学期数据结构考了多少分"
  options:
    today: "2026-09-21"
    fixtures:
      faults:
        - source: grades
          kind: patch
          set: {score: "59", gradePassed: false}
          where: {courseName: 数据结构}

expect:
  mode: contains
  tools:
    - name: get_grades
  refusal: false
  answer_contains: ["89"]

# 归因校准：期望写的是真实值，但数据源被静默篡改，agent 忠实转述必然「答错」。
# 正确归因是 L5（数据源本身错），误归 L4 说明归因器分不清「读错」和「数据错」
inject:
  base: grades_last_term_001
  op: "fault:patch"
  layer: L5
  detail: 数据结构 score 89 → 59
